[project]
name = "job-assistant"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.142.2",
    "openai>=3.26.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "typesafe-sdk>=0.7.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_assistant"]
